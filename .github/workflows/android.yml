name: Build ANIKA PDF APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 16.0

      - name: Check project files
        run: |
          echo "Checking ANIKA PDF project..."
          ls -la
          test -f settings.gradle.kts || {
            echo "ERROR: settings.gradle.kts is missing"
            exit 1
          }
          test -f build.gradle.kts || {
            echo "ERROR: build.gradle.kts is missing"
            exit 1
          }
          test -d app || {
            echo "ERROR: app folder is missing"
            exit 1
          }

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ANIKA-PDF-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
