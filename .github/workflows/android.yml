name: Build ANIKA PDF APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Use v4 without a pinned cmdline-tools version. This avoids the old
      # v3 action requesting the invalid commandlinetools-linux-16_latest.zip URL.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Check project files
        run: |
          set -e
          test -f settings.gradle.kts || { echo "ERROR: settings.gradle.kts is missing"; exit 1; }
          test -f build.gradle.kts || { echo "ERROR: build.gradle.kts is missing"; exit 1; }
          test -f app/build.gradle.kts || { echo "ERROR: app/build.gradle.kts is missing"; exit 1; }
          test -f app/src/main/AndroidManifest.xml || { echo "ERROR: AndroidManifest.xml is missing"; exit 1; }
          test -d app/src/main/java || { echo "ERROR: app source folder is missing"; exit 1; }
          echo "Project files found."

      # This repository currently has no Gradle Wrapper files, so install
      # the Gradle version required by Android Gradle Plugin 8.7.3.
      - name: Install Gradle 8.9
        run: |
          set -e
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle-8.9-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" --version

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ANIKA-PDF-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
