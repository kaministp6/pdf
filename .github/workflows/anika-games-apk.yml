name: Build ANIKA GAMES APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'games/ANIKA-GAMES/**'
      - '.github/workflows/anika-games-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: games/ANIKA-GAMES
        run: gradle assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ANIKA-GAMES-debug-apk
          path: games/ANIKA-GAMES/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
