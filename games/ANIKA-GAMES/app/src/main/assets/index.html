<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10182f"><title>ANIKA GAMES</title>
<style>
:root{--bg:#10182f;--panel:#192541;--line:#354466;--text:#f5f7ff;--muted:#9eacc9;--blue:#6f8cff;--gold:#ffc96b;--cell:#202d4b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#24375f 0,#10182f 58%);font-family:system-ui,-apple-system,sans-serif;color:var(--text);min-height:100vh;padding:20px 14px 28px}.app{max-width:520px;margin:auto}.top{display:flex;align-items:center;gap:12px;margin:4px 0 22px}.logo{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,#9ab0ff,#5470ed);display:grid;place-items:center;color:#10182f;font-weight:950;font-size:20px;box-shadow:0 8px 24px #080e23}.brand{font-weight:900;letter-spacing:1.8px;font-size:18px}.sub{font-size:11px;color:var(--muted);letter-spacing:2px;margin-top:3px}.pill{margin-left:auto;color:#ffe0a2;background:#443820;border:1px solid #6d5933;border-radius:30px;padding:7px 10px;font-size:11px;font-weight:800}.welcome h1{font-size:27px;margin:0 0 4px;letter-spacing:-.7px}.welcome p{color:var(--muted);font-size:13px;margin:0 0 18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}.stat{background:#192541d9;border:1px solid #2c3a5a;border-radius:15px;padding:11px;text-align:center}.stat small{display:block;color:var(--muted);font-size:10px;letter-spacing:1px}.stat b{font-size:19px;display:block;margin-top:3px}.panel{background:#182440;border:1px solid #344466;border-radius:20px;padding:13px;box-shadow:0 14px 35px #080e2350}.board{display:grid;grid-template-columns:repeat(9,1fr);border:2px solid #8197cb;border-radius:8px;overflow:hidden;aspect-ratio:1}.cell{display:grid;place-items:center;min-width:0;background:var(--cell);border:0;border-right:1px solid #354466;border-bottom:1px solid #354466;color:#f7f8ff;font-size:clamp(16px,5vw,23px);font-weight:650;padding:0;aspect-ratio:1}.cell:nth-child(3n){border-right:2px solid #8197cb}.cell:nth-child(9n){border-right:0}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid #8197cb}.cell.given{color:#d5def5;background:#253452}.cell.selected{background:#5269ad!important;color:white}.cell.related{background:#33476d}.cell.same{background:#42578a}.cell.error{color:#ff929b}.cell.hinted{color:#ffc96b}.controls{display:flex;gap:8px;margin:13px 0 10px}.select{flex:1;background:#202e4c;color:white;border:1px solid #3c4d70;border-radius:12px;padding:10px;font-weight:700}.btn{border:0;border-radius:12px;padding:11px 13px;font-weight:800;color:#10182f;background:#9db0ff}.btn.secondary{background:#263654;color:#e7ecff;border:1px solid #3b4d70}.keypad{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;margin-top:11px}.key{background:#263654;border:1px solid #3d5076;border-radius:10px;color:white;font-size:18px;font-weight:800;padding:11px 0}.key:active,.btn:active{transform:scale(.97)}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.tools button{font-size:12px;padding:11px 5px}.foot{text-align:center;color:#8494b7;font-size:10px;letter-spacing:1.5px;margin:18px 0 4px}.notice{min-height:19px;color:#ffdb91;text-align:center;font-size:12px;margin-top:9px}
</style></head><body><main class="app">
<header class="top"><div class="logo">A</div><div><div class="brand">ANIKA GAMES</div><div class="sub">THINK • PLAY • GROW</div></div><div class="pill">MIND PUZZLE</div></header>
<section class="welcome"><h1>Train your brain.</h1><p>A little focus. A smarter you. ✦</p></section>
<section class="stats"><div class="stat"><small>TIME</small><b id="time">00:00</b></div><div class="stat"><small>SCORE</small><b id="score">000</b></div><div class="stat"><small>MISTAKES</small><b id="mistakes">0 / 3</b></div></section>
<section class="panel"><div class="board" id="board" aria-label="Sudoku board"></div>
<div class="controls"><select id="level" class="select" aria-label="Difficulty"><option value="easy">Easy · 4 stars</option><option value="medium">Medium · 5 stars</option><option value="hard">Hard · 6 stars</option></select><button class="btn" id="new">New Game ↻</button></div>
<div class="keypad" id="keys"></div>
<div class="tools"><button class="btn secondary" id="erase">⌫ Erase</button><button class="btn secondary" id="hint">✦ Hint</button><button class="btn secondary" id="check">✓ Check</button></div><div class="notice" id="notice">Choose a cell, then tap a number.</div></section>
<div class="foot">ANIKA GAMES  •  MADE FOR CURIOUS MINDS</div>
</main>
<script>
const puzzles={
easy:"530070000600195000098000060800060003400803001700020006060000280000419005000080079",
medium:"004678010672000348100342567859761423426853791713924856961537284287419635345286179",
hard:"000000907000420180000705026100904000050000040000507009920108000034059000507000000"
};
let solution="",cells=[],selected=-1,seconds=0,score=0,mistakes=0,timer=null;
const $=id=>document.getElementById(id);
function solve(a){let i=a.indexOf("0");if(i<0)return a;let r=Math.floor(i/9),c=i%9;for(let n=1;n<=9;n++){let s=String(n),ok=true;for(let k=0;k<9;k++)if(a[r*9+k]===s||a[k*9+c]===s||a[(Math.floor(r/3)*3+Math.floor(k/3))*9+Math.floor(c/3)*3+k%3]===s){ok=false;break}if(ok){let out=solve(a.slice(0,i)+s+a.slice(i+1));if(out)return out}}return ""}
function start(){clearInterval(timer);seconds=0;score=0;mistakes=0;selected=-1;let p=puzzles[$("level").value];solution=solve(p);cells=p.split("").map((v,i)=>({v,given:v!=="0",error:false,el:null}));$("notice").textContent="Choose a cell, then tap a number.";render();stats();timer=setInterval(()=>{seconds++;stats()},1000)}
function render(){let b=$("board");b.innerHTML="";cells.forEach((cell,i)=>{let e=document.createElement("button");e.className="cell"+(cell.given?" given":"")+(cell.error?" error":"");e.textContent=cell.v==="0"?"":cell.v;e.setAttribute("aria-label","Row "+(Math.floor(i/9)+1)+", column "+(i%9+1)+", "+(cell.v==="0"?"empty":cell.v));e.onclick=()=>{selected=i;render()};if(i===selected)e.classList.add("selected");else if(selected>=0){let sr=Math.floor(selected/9),sc=selected%9,r=Math.floor(i/9),c=i%9;if(r===sr||c===sc||(Math.floor(r/3)===Math.floor(sr/3)&&Math.floor(c/3)===Math.floor(sc/3)))e.classList.add("related");if(cell.v!=="0"&&cell.v===cells[selected].v)e.classList.add("same")}cell.el=e;b.appendChild(e)});let k=$("keys");k.innerHTML="";for(let n=1;n<=9;n++){let e=document.createElement("button");e.className="key";e.textContent=n;e.onclick=()=>enter(String(n));k.appendChild(e)}}
function enter(n){if(selected<0){$("notice").textContent="First choose an empty cell.";return}let c=cells[selected];if(c.given){$("notice").textContent="That number is locked. Choose an empty cell.";return}if(c.v===n)return;c.v=n;c.error=n!==solution[selected];if(c.error){mistakes++;$("notice").textContent="Not quite—try again.";if(mistakes>=3){$("notice").textContent="Three mistakes! Try a fresh puzzle.";}}else{score+=10;$("notice").textContent="Nice move! +10 points.";if(cells.every((x,i)=>x.v===solution[i])){$("notice").textContent="Puzzle complete! Brilliant work! ✨";score+=100;clearInterval(timer)}}stats();render()}
function stats(){$("time").textContent=String(Math.floor(seconds/60)).padStart(2,"0")+":"+String(seconds%60).padStart(2,"0");$("score").textContent=String(score).padStart(3,"0");$("mistakes").textContent=mistakes+" / 3"}
$("new").onclick=start;$("level").onchange=start;$("erase").onclick=()=>{if(selected>=0&&!cells[selected].given){cells[selected].v="0";cells[selected].error=false;render()}};$("hint").onclick=()=>{if(selected<0||cells[selected].given){$("notice").textContent="Choose an empty cell for a hint.";return}cells[selected].v=solution[selected];cells[selected].error=false;score=Math.max(0,score-5);$("notice").textContent="A little help costs 5 points.";render();stats()};$("check").onclick=()=>{$("notice").textContent=cells.every((c,i)=>c.v==="0"||c.v===solution[i])?"So far, so good!":"Some numbers need another look."};start();
</script></body></html>
